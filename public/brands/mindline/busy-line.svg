<!--
  The busy animation's line (app-loading-line): the m of the mindline emblem as an open centerline.
  The app strokes it in the text colour, lets it rest, then a wave flattens and regrows it from
  left to right. Only the first <path> counts: an absolute `M x,y` followed by `C` pieces, about
  50 units wide; its stroke-width is the line's width.
-->
