<!--
  The busy animation's line (app-loading-line): a plain wave. Replace it in a brand pack of your
  own with a line from your logo. Only the first <path> counts: an absolute `M x,y` followed by
  `C` pieces, about 50 units wide; its stroke-width is the line's width.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 52 24">
  <path fill="none" stroke="currentColor" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"
    d="M 2,20 C 6,12 10,12 14,20 C 18,28 22,28 26,20 C 30,12 34,12 38,20 C 42,28 46,28 50,20" />
</svg>
